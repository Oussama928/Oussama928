<svg xmlns="http://www.w3.org/2000/svg" width="850" height="220" viewBox="0 0 850 220" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#101B30"/>
      <stop offset="1" stop-color="#0A3060"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2F81F7" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2F81F7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00C2A8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00C2A8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F81F7"/>
      <stop offset="0.5" stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#00C2A8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; text-anchor: middle; }
    .name { font-size: 38px; font-weight: 800; letter-spacing: 5px; fill: #FFFFFF; }
    .sub { font-size: 15px; fill: #9AA9C3; letter-spacing: 0.5px; }
    .pill { font-size: 12.5px; font-weight: 700; letter-spacing: 1.5px; fill: #E6EDF3; }
  </style>

  <rect width="850" height="220" fill="url(#bg)"/>
  <rect width="850" height="220" fill="url(#grid)"/>
  <ellipse cx="180" cy="110" rx="280" ry="140" fill="url(#glowBlue)"/>
  <ellipse cx="680" cy="110" rx="280" ry="140" fill="url(#glowTeal)"/>
  <rect width="850" height="3" fill="url(#topline)"/>

  <text class="name" x="425" y="105">OUSSAMA GHAZOUANI</text>
  <text class="sub" x="425" y="132">Building systems that survive production</text>

  <!-- pills -->
  <g>
    <rect x="138" y="152" width="168" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text class="pill" x="222" y="175">FULL-STACK</text>

    <rect x="318" y="152" width="214" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text class="pill" x="425" y="175">CLOUD / DEVOPS</text>

    <rect x="544" y="152" width="168" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.16"/>
    <text class="pill" x="628" y="175">AGENTIC AI</text>
  </g>
</svg>
