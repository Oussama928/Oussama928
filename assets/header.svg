<svg xmlns="http://www.w3.org/2000/svg" width="850" height="150" viewBox="0 0 850 150" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#0a3060"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
    .name { font-size: 30px; font-weight: 700; letter-spacing: 6px; }
    .desc { font-size: 15px; fill: #cfe6ff; letter-spacing: 1.5px; }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-850px); } }
    .wave  { animation: drift 9s  linear infinite; }
    .wave2 { animation: drift 16s linear infinite reverse; }
  </style>

  <!-- back wave: slower, drifts the other way -->
  <g class="wave2" opacity="0.35">
    <path fill="#58a6ff" d="M0 100 Q 85 65 170 100 T 340 100 T 510 100 T 680 100 T 850 100 T 1020 100 T 1190 100 T 1360 100 T 1530 100 T 1700 100 L 1700 0 L 0 0 Z"/>
  </g>
  <!-- front wave: gradient body -->
  <g class="wave">
    <path fill="url(#bg)" d="M0 110 Q 106.25 75 212.5 110 T 425 110 T 637.5 110 T 850 110 T 1062.5 110 T 1275 110 T 1487.5 110 T 1700 110 L 1700 0 L 0 0 Z"/>
  </g>

  <text class="name" x="425" y="62">OUSSAMA GHAZOUANI</text>
  <text class="desc" x="425" y="88">full-stack dev · DevSecOps · security</text>
</svg>
