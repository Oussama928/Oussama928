<svg xmlns="http://www.w3.org/2000/svg" width="850" height="150" viewBox="0 0 850 150" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#0a3060">
        <animate attributeName="stop-color" values="#0a3060;#0d4a8a;#0a3060" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="body">
      <path d="M0 110 Q 106.25 75 212.5 110 T 425 110 T 637.5 110 T 850 110 T 1062.5 110 T 1275 110 T 1487.5 110 T 1700 110 L 1700 0 L 0 0 Z"/>
    </clipPath>
  </defs>
  <style>
    text { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
    .name { font-size: 30px; font-weight: 700; letter-spacing: 6px; filter: drop-shadow(0 2px 5px rgba(0,0,0,0.55)); }
    .desc { font-size: 15px; fill: #cfe6ff; letter-spacing: 1.5px; filter: drop-shadow(0 1px 3px rgba(0,0,0,0.45)); }
    @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-850px); } }
    .wave  { animation: drift 9s  linear infinite; }
    .wave3 { animation: drift 14s linear infinite; }
    .wave2 { animation: drift 19s linear infinite reverse; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(4px); } }
    .bob2 { animation: bob 9s ease-in-out -4.5s infinite; }
    .bob3 { animation: bob 7s ease-in-out -2s   infinite; }
    @keyframes rise {
      0%   { transform: translateY(35px); opacity: 0; }
      15%  { opacity: 0.55; }
      85%  { opacity: 0.55; }
      100% { transform: translateY(-75px); opacity: 0; }
    }
    .b { animation: rise 9s ease-in infinite; }
    .b1 { animation-duration: 8s;  animation-delay: 0s;   }
    .b2 { animation-duration: 11s; animation-delay: 2.2s; }
    .b3 { animation-duration: 7s;  animation-delay: 4.5s; }
    .b4 { animation-duration: 12s; animation-delay: 1.1s; }
    .b5 { animation-duration: 9s;  animation-delay: 5.8s; }
    .b6 { animation-duration: 10s; animation-delay: 3.1s; }
    .b7 { animation-duration: 13s; animation-delay: 0.7s; }
    .b8 { animation-duration: 8.5s; animation-delay: 6.4s; }
    @keyframes twinkle { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.9; } }
    .t  { animation: twinkle 4.5s ease-in-out infinite; }
    .t1 { animation-delay: 0s;   }
    .t2 { animation-delay: 0.6s; }
    .t3 { animation-delay: 1.2s; }
    .t4 { animation-delay: 1.8s; }
    .t5 { animation-delay: 2.4s; }
    .t6 { animation-delay: 3.0s; }
    .t7 { animation-delay: 3.6s; }
    .t8 { animation-delay: 4.2s; }
    @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.75; } }
    .halo { animation: pulse 6s ease-in-out infinite; }
  </style>

  <!-- twinkling stars in the dark sky, kept clear of the name -->
  <g fill="#cfe6ff">
    <circle class="t t1" cx="60"  cy="14" r="1.4"/>
    <circle class="t t2" cx="150" cy="24" r="1.1"/>
    <circle class="t t3" cx="255" cy="12" r="1.6"/>
    <circle class="t t4" cx="365" cy="22" r="1.2"/>
    <circle class="t t5" cx="478" cy="14" r="1.5"/>
    <circle class="t t6" cx="590" cy="24" r="1.1"/>
    <circle class="t t7" cx="700" cy="12" r="1.4"/>
    <circle class="t t8" cx="795" cy="20" r="1.6"/>
    <circle class="t t3" cx="36"  cy="52" r="1.2"/>
    <circle class="t t6" cx="815" cy="48" r="1.3"/>
  </g>

  <!-- back waves drift the other way and gently bob; tops extended past the viewBox so bobbing never exposes a seam -->
  <g class="bob2" opacity="0.30">
    <g class="wave2">
      <path fill="#58a6ff" d="M0 100 Q 85 65 170 100 T 340 100 T 510 100 T 680 100 T 850 100 T 1020 100 T 1190 100 T 1360 100 T 1530 100 T 1700 100 L 1700 -12 L 0 -12 Z"/>
    </g>
  </g>
  <g class="bob3" opacity="0.45">
    <g class="wave3">
      <path fill="#388bfd" d="M0 90 Q 53.125 60 106.25 90 T 212.5 90 T 318.75 90 T 425 90 T 531.25 90 T 637.5 90 T 743.75 90 T 850 90 T 956.25 90 T 1062.5 90 T 1168.75 90 T 1275 90 T 1381.25 90 T 1487.5 90 T 1593.75 90 T 1700 90 L 1700 -12 L 0 -12 Z"/>
    </g>
  </g>

  <!-- front wave with a foam crest tracing its top -->
  <g class="wave">
    <path fill="url(#bg)" d="M0 110 Q 106.25 75 212.5 110 T 425 110 T 637.5 110 T 850 110 T 1062.5 110 T 1275 110 T 1487.5 110 T 1700 110 L 1700 0 L 0 0 Z"/>
    <path fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"
          d="M0 110 Q 106.25 75 212.5 110 T 425 110 T 637.5 110 T 850 110 T 1062.5 110 T 1275 110 T 1487.5 110 T 1700 110"/>
  </g>

  <!-- bubbles, clipped to the wave body -->
  <g clip-path="url(#body)">
    <circle class="b b1" cx="120" cy="125" r="4"   fill="#9cd3ff" opacity="0"/>
    <circle class="b b2" cx="262" cy="130" r="3"   fill="#ffffff" opacity="0"/>
    <circle class="b b3" cx="392" cy="128" r="5"   fill="#9cd3ff" opacity="0"/>
    <circle class="b b4" cx="521" cy="132" r="3"   fill="#ffffff" opacity="0"/>
    <circle class="b b5" cx="643" cy="126" r="4.5" fill="#9cd3ff" opacity="0"/>
    <circle class="b b6" cx="758" cy="131" r="3"   fill="#ffffff" opacity="0"/>
    <circle class="b b7" cx="58"  cy="133" r="2.5" fill="#9cd3ff" opacity="0"/>
    <circle class="b b8" cx="816" cy="129" r="2.5" fill="#ffffff" opacity="0"/>
  </g>

  <ellipse class="halo" cx="425" cy="56" rx="240" ry="34" fill="url(#glow)"/>
  <text class="name" x="425" y="62">OUSSAMA GHAZOUANI</text>
  <text class="desc" x="425" y="88">DevSecOps · agentic AI · full-stack</text>
</svg>
