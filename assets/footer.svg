  </style>

  <g class="wave2" opacity="0.35">
    <path fill="#58a6ff" d="M0 22 Q 85 52 170 22 T 340 22 T 510 22 T 680 22 T 850 22 T 1020 22 T 1190 22 T 1360 22 T 1530 22 T 1700 22 L 1700 80 L 0 80 Z"/>
  </g>
