<svg xmlns="http://www.w3.org/2000/svg" width="850" height="80" viewBox="0 0 850 80" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0078D4"/>
      <stop offset="0.45" stop-color="#0a3060"/>
      <stop offset="1" stop-color="#0d1117"/>
