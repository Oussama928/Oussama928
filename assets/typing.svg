<svg xmlns="http://www.w3.org/2000/svg" width="640" height="56" viewBox="0 0 640 56" role="img">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#79c0ff"/>
      <stop offset="0.5" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#0078D4"/>
    </linearGradient>
  </defs>
  <style>
    text {
      font: 600 19px 'JetBrains Mono', 'Fira Code', Consolas, monospace;
      fill: url(#g);
      text-anchor: middle;
      opacity: 0;
    }
    @keyframes cycle {
      0%   { opacity: 0; transform: translateY(12px); }
      6%   { opacity: 1; transform: translateY(0); }
      29%  { opacity: 1; transform: translateY(0); }
      35%  { opacity: 0; transform: translateY(-12px); }
      100% { opacity: 0; transform: translateY(-12px); }
    }
    .l1 { animation: cycle 9s cubic-bezier(0.25, 0.8, 0.35, 1) infinite; }
    .l2 { animation: cycle 9s cubic-bezier(0.25, 0.8, 0.35, 1) 3s infinite; }
    .l3 { animation: cycle 9s cubic-bezier(0.25, 0.8, 0.35, 1) 6s infinite; }
  </style>
  <text class="l1" x="320" y="34">I ship it, then I harden it</text>
  <text class="l2" x="320" y="34">Alexa, feed the cat</text>
  <text class="l3" x="320" y="34">break things on purpose, fix them properly</text>
</svg>
